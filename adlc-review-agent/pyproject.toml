[project]
name = "adlc-review-agent"
version = "0.1.0"
description = "Standalone PR-review agent built on Meko — the open-source agent core behind the ADLC Review Agent Lab in meko_ui. Runs on your own machine against your own Meko PAT, GitHub token, and LLM key; no dependency on meko_ui or inference_gateway."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.40",
    "click>=8.1",
    "bedrock-agentcore>=0.1",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
adlc-review-agent = "adlc_review_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adlc_review_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
